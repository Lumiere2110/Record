<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record</title>
<meta name="description" content="Claude Code で作ったプロジェクト・リポジトリ・Artifact の目的と作業記録">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1>Record</h1>
    <p class="lead">Claude Code で作ったプロジェクト・リポジトリ・Artifact の目的と作業の記録</p>
    <p class="updated" id="updated"></p>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats" aria-label="件数"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" class="tab is-active" data-view="list" aria-selected="true">一覧</button>
    <button role="tab" class="tab" data-view="timeline" aria-selected="false">作業タイムライン</button>
  </nav>

  <section class="controls" aria-label="絞り込み">
    <input type="search" id="q" placeholder="名前・目的・作業内容で検索" aria-label="検索">
    <div class="chips" id="typeChips"></div>
    <select id="category" aria-label="カテゴリ"></select>
    <select id="sort" aria-label="並び順">
      <option value="updated">更新が新しい順</option>
      <option value="created">作成が新しい順</option>
      <option value="name">名前順</option>
    </select>
  </section>

  <section id="list" class="grid"></section>
  <section id="timeline" class="timeline" hidden></section>
  <p id="empty" class="empty" hidden>該当する記録はありません。</p>
</main>

<dialog id="detail" class="detail">
  <div class="detail-body" id="detailBody"></div>
  <form method="dialog"><button class="close" aria-label="閉じる">閉じる</button></form>
</dialog>

<footer class="wrap footer">
  記録は <code>data/records.json</code> にあります。追記のしかたは README を見てください。
</footer>
<script src="js/app.js"></script>
</body>
</html>
